rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- name: AgentFlowUnavailable
  interval: 1m
  input_series:
  - series: up{job="agentflow",instance="serve"}
    values: 0 0 0 1 1
  alert_rule_test:
  - eval_time: 0m
    alertname: AgentFlowUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowUnavailable
    exp_alerts:
    - exp_labels:
        job: agentflow
        instance: serve
        severity: warning
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 4m
    alertname: AgentFlowUnavailable
    exp_alerts: []
- name: AgentFlowSnapshotStale
  interval: 1m
  input_series:
  - series: agentflow_metrics_snapshot_age_seconds{job="agentflow",instance="serve"}
    values: 61 61 61 0 0
  - series: agentflow_metrics_snapshot_ready{job="agentflow",instance="serve"}
    values: 1+0x4
  alert_rule_test:
  - eval_time: 0m
    alertname: AgentFlowSnapshotStale
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowSnapshotStale
    exp_alerts:
    - exp_labels:
        job: agentflow
        instance: serve
        severity: warning
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 4m
    alertname: AgentFlowSnapshotStale
    exp_alerts: []
- name: AgentFlowInboxOld
  interval: 1m
  input_series:
  - series: agentflow_oldest_age_seconds{job="agentflow",instance="serve",queue="inbox"}
    values: 301 301 301 0 0
  alert_rule_test:
  - eval_time: 0m
    alertname: AgentFlowInboxOld
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowInboxOld
    exp_alerts:
    - exp_labels:
        job: agentflow
        instance: serve
        severity: warning
        queue: inbox
      exp_annotations:
