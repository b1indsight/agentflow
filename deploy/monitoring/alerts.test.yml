    exp_alerts: []
- name: no data
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 2m
    alertname: AgentFlowUnavailable
    exp_alerts:
    - exp_labels:
        job: agentflow
        severity: warning
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 2m
    alertname: AgentFlowSnapshotStale
    exp_alerts:
    - exp_labels:
        job: agentflow
        severity: warning
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 2m
    alertname: AgentFlowInboxOld
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowInboxBlocked
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowNoWorkers
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowRecoveryOld
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowArchiveOld
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowBackupFailed
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowBackupOld
    exp_alerts: []
  - eval_time: 2m
