        state: blocked
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 4m
    alertname: FlowtoolInboxBlocked
    exp_alerts: []
- name: FlowtoolNoWorkers
  interval: 1m
  input_series:
  - series: flowtool_jobs{job="flowtool",instance="serve",kind="initial",state="queued"}
    values: 1+0x4
  - series: flowtool_workers{job="flowtool",instance="serve",state="online"}
    values: 0 0 0 1 1
  alert_rule_test:
  - eval_time: 1m
    alertname: FlowtoolNoWorkers
    exp_alerts: []
  - eval_time: 2m
