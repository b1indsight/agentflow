  - eval_time: 4m
    alertname: AgentFlowInboxOld
    exp_alerts: []
- name: AgentFlowInboxBlocked
  interval: 1m
  input_series:
  - series: agentflow_inbox{job="agentflow",instance="serve",state="blocked"}
    values: 1 1 1 0 0
  alert_rule_test:
  - eval_time: 0m
    alertname: AgentFlowInboxBlocked
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowInboxBlocked
    exp_alerts:
    - exp_labels:
        job: agentflow
        instance: serve
        severity: warning
        state: blocked
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 4m
    alertname: AgentFlowInboxBlocked
    exp_alerts: []
- name: AgentFlowNoWorkers
  interval: 1m
  input_series:
  - series: agentflow_jobs{job="agentflow",instance="serve",kind="initial",state="queued"}
    values: 1+0x4
  - series: agentflow_workers{job="agentflow",instance="serve",state="online"}
    values: 0 0 0 1 1
  alert_rule_test:
  - eval_time: 1m
    alertname: AgentFlowNoWorkers
    exp_alerts: []
  - eval_time: 2m
    alertname: AgentFlowNoWorkers
    exp_alerts:
    - exp_labels:
