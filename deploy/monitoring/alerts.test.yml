rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- name: FlowtoolUnavailable
  interval: 1m
  input_series:
  - series: up{job="flowtool",instance="serve"}
    values: 0 0 0 1 1
  alert_rule_test:
  - eval_time: 0m
    alertname: FlowtoolUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: FlowtoolUnavailable
    exp_alerts:
    - exp_labels:
        job: flowtool
        instance: serve
        severity: warning
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 4m
    alertname: FlowtoolUnavailable
    exp_alerts: []
- name: FlowtoolSnapshotStale
  interval: 1m
  input_series:
  - series: flowtool_metrics_snapshot_age_seconds{job="flowtool",instance="serve"}
    values: 61 61 61 0 0
  - series: flowtool_metrics_snapshot_ready{job="flowtool",instance="serve"}
    values: 1+0x4
  alert_rule_test:
  - eval_time: 0m
    alertname: FlowtoolSnapshotStale
    exp_alerts: []
  - eval_time: 2m
    alertname: FlowtoolSnapshotStale
    exp_alerts:
    - exp_labels:
        job: flowtool
        instance: serve
        severity: warning
      exp_annotations:
        runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - eval_time: 4m
    alertname: FlowtoolSnapshotStale
    exp_alerts: []
- name: FlowtoolInboxOld
