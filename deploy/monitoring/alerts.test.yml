    values: 0 0 0 1 1
  - series: agentflow_backup_last_run_success{job="agentflow-backup",instance="backup"}
    values: 1+0x4
  - series: agentflow_backup_last_success_timestamp_seconds{job="agentflow-backup",instance="backup"}
