groups:
- name: agentflow
  rules:
  - alert: AgentFlowUnavailable
    expr: (up{job="agentflow"} == 0) or absent(up{job="agentflow"})
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowSnapshotStale
    expr: (agentflow_metrics_snapshot_age_seconds{job="agentflow"} > 60) or (agentflow_metrics_snapshot_ready{job="agentflow"}
      == 0) or absent(agentflow_metrics_snapshot_ready{job="agentflow"})
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowInboxOld
    expr: agentflow_oldest_age_seconds{job="agentflow",queue="inbox"} > 300
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowInboxBlocked
    expr: agentflow_inbox{job="agentflow",state="blocked"} > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowNoWorkers
    expr: (sum by (job, instance) (agentflow_jobs{job="agentflow",state="queued"}) > 0) unless on (job, instance) (sum by (job,
      instance) (agentflow_workers{job="agentflow",state=~"online|busy"}) > 0)
    for: 2m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowRecoveryOld
    expr: agentflow_oldest_age_seconds{job="agentflow",queue="recovery"} > 600
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowArchiveOld
    expr: agentflow_archive_pending_age_seconds{job="agentflow"} > 600
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowBackupFailed
    expr: agentflow_backup_last_run_success{job="agentflow-backup"} == 0
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowBackupOld
    expr: (time() - agentflow_backup_last_success_timestamp_seconds{job="agentflow-backup"}) > 93600
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
  - alert: AgentFlowBackupMissing
    expr: (up{job="agentflow-backup"} == 0) or absent(up{job="agentflow-backup"}) or absent(agentflow_backup_last_run_success{job="agentflow-backup"})
      or absent(agentflow_backup_last_success_timestamp_seconds{job="agentflow-backup"})
    for: 1m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/b1indsight/agentflow/blob/feat/m5-operations-recovery/docs/operations/runbook.md#alerts
