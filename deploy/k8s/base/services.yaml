apiVersion: v1
kind: Service
metadata:
  name: agentflow-serve
spec:
  selector:
    agentflow-role: serve
  ports:
  - name: http
    port: 8000
  - name: wss
    port: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: agentflow-serve-headless
spec:
  clusterIP: None
  selector:
    agentflow-role: serve
---
apiVersion: v1
kind: Service
metadata:
  name: agentflow-worker-1-headless
spec:
  clusterIP: None
  selector:
    agentflow-role: worker-1
