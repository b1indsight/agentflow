name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.3"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ruff
            name: Ruff
          - id: mypy
            name: Mypy
          - id: build
            name: Build

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        if: matrix.id != 'build'
        run: uv sync --locked --dev

      - name: Run Ruff
        if: matrix.id == 'ruff'
        run: uv run ruff check app tests

      - name: Run Mypy
        if: matrix.id == 'mypy'
        run: uv run mypy app tests

      - name: Build distributions
        if: matrix.id == 'build'
        run: uv build --no-sources

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowtool_test
          POSTGRES_USER: flowtool
          POSTGRES_PASSWORD: flowtool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowtool -d flowtool_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      FLOWTOOL_DATABASE_URL: postgresql://flowtool:flowtool@127.0.0.1:5432/flowtool_test
      FLOWTOOL_TEST_DATABASE_URL: postgresql://flowtool:flowtool@127.0.0.1:5432/flowtool_test
      FLOWTOOL_WORKER_ID: worker-1
      FLOWTOOL_WORKER_TOKEN: ci-worker-secret
      FLOWTOOL_WORKER_TOKENS: '{"worker-1":"ci-worker-secret","worker-2":"ci-worker-secret-2"}'
      # The process smoke makes no GitHub requests; these values exercise startup shape checks only.
      FLOWTOOL_GITHUB_APP_ID: "123"
      FLOWTOOL_GITHUB_PRIVATE_KEY_PATH: env.example
      FLOWTOOL_SERVE_WS_URL: ws://127.0.0.1:8000/internal/workers/connect
      FLOWTOOL_ALLOW_INSECURE_WORKER_WS: "true"
      FLOWTOOL_WORKER_ROOT: /tmp/flowtool-ci-worker-1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run pytest
        run: uv run pytest

      - name: Smoke control plane and remote worker processes
        run: |
          uv run flowtool serve > /tmp/flowtool.log 2>&1 &
          server_pid=$!
          worker_pid_a=""
          worker_pid_b=""
          cleanup() {
            if [ -n "$worker_pid_a" ]; then
              kill "$worker_pid_a" 2>/dev/null || true
            fi
            if [ -n "$worker_pid_b" ]; then
              kill "$worker_pid_b" 2>/dev/null || true
            fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8000/healthz
          uv run flowtool worker > /tmp/flowtool-worker-1.log 2>&1 &
          worker_pid_a=$!
          FLOWTOOL_WORKER_ID=worker-2 \
            FLOWTOOL_WORKER_TOKEN=ci-worker-secret-2 \
            FLOWTOOL_WORKER_ROOT=/tmp/flowtool-ci-worker-2 \
            uv run flowtool worker > /tmp/flowtool-worker-2.log 2>&1 &
          worker_pid_b=$!
          for attempt in $(seq 1 20); do
            if grep --quiet "registered with control plane" /tmp/flowtool-worker-1.log \
              && grep --quiet "registered with control plane" /tmp/flowtool-worker-2.log; then
              break
            fi
            sleep 0.25
          done
          kill -0 "$server_pid"
          kill -0 "$worker_pid_a"
          kill -0 "$worker_pid_b"
          grep --quiet "registered with control plane" /tmp/flowtool-worker-1.log
          grep --quiet "registered with control plane" /tmp/flowtool-worker-2.log
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          uv run flowtool serve >> /tmp/flowtool.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8000/healthz
          for attempt in $(seq 1 40); do
            worker_a_registrations=$(grep --count "registered with control plane" /tmp/flowtool-worker-1.log || true)
            worker_b_registrations=$(grep --count "registered with control plane" /tmp/flowtool-worker-2.log || true)
            if [ "$worker_a_registrations" -ge 2 ] && [ "$worker_b_registrations" -ge 2 ]; then
              break
            fi
            sleep 0.25
          done
          test "$worker_a_registrations" -ge 2
          test "$worker_b_registrations" -ge 2
          kill "$worker_pid_a"
          wait "$worker_pid_a" 2>/dev/null || true
          kill -0 "$worker_pid_b"
