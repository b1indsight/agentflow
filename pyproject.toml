[project]
name = "flowtool"
version = "0.0.1"
description = "Headless orchestrator: GitHub issues labeled `flow` -> code agent (codex) -> PR -> review loop -> manual merge -> archive."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "githubkit[auth-app]>=0.16,<0.17",  # calibrated App auth and REST surface
    "bub==0.4.1",            # Calibrated private ModelRunner completion contract
    "pydantic>=2.12",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pluggy>=1.5",           # plugin hooks
    "typer>=0.12",
    "httpx>=0.27",
    "loguru>=0.7",
    "websockets>=14",
    "prometheus-client==0.24.1",
]

[project.scripts]
flowtool = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
